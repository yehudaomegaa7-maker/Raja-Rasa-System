<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raja Rasa COFFEE & RESTO - POS & KDS System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js & Datalabels Plugin untuk Persentase Pie Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <!-- XLSX Library untuk Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Kertas Thermal 58mm Presisi CSS Print */
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        margin: 0;
        padding: 2mm;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        color: #000 !important;
        background: #fff !important;
      }
      @page {
        size: 58mm auto;
        margin: 0;
      }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased min-h-screen transition-colors duration-200">

  <!-- TOP BAR / HEADER (Hanya Muncul Saat Dalam Ruangan) -->
  <header id="main-header" class="hidden bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex flex-wrap items-center justify-between sticky top-0 z-40 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-brand-500 flex items-center justify-center font-bold text-white text-xl shadow-md">
        👑
      </div>
      <div>
        <h1 class="font-bold text-lg text-brand-600 dark:text-brand-500 leading-tight">Raja Rasa</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">COFFEE & RESTO POS</p>
      </div>
    </div>

    <div class="flex items-center space-x-2 mt-2 sm:mt-0">
      <span id="active-room-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-brand-100 dark:bg-brand-900/60 text-brand-700 dark:text-brand-300 border border-brand-300 dark:border-brand-700 flex items-center gap-1.5">
        <i class="fa-solid fa-door-open"></i> <span id="badge-room-name">Lobby</span>
      </span>

      <!-- Tombol Refresh Cepat -->
      <button onclick="refreshCurrentRoom()" title="Refresh Data" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition flex items-center gap-1 shadow">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>

      <!-- Theme Switcher (Default Light Mode) -->
      <button onclick="toggleTheme()" title="Ubah Tema" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
        <i id="theme-icon" class="fa-solid fa-sun text-yellow-500"></i>
      </button>

      <!-- Bluetooth Connectors -->
      <button onclick="connectBTPrinter('kasir')" id="btn-bt-kasir" title="Hubungkan Printer Kasir" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-xs text-gray-700 dark:text-gray-300 hover:text-brand-600 dark:hover:text-brand-400">
        <i class="fa-solid fa-print"></i> <span class="hidden md:inline">Print Kasir</span>
      </button>
      <button onclick="connectBTPrinter('kitchen')" id="btn-bt-kitchen" title="Hubungkan Printer Dapur" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-xs text-gray-700 dark:text-gray-300 hover:text-brand-600 dark:hover:text-brand-400">
        <i class="fa-solid fa-utensils"></i> <span class="hidden md:inline">Print Dapur</span>
      </button>

      <!-- Lock / Return to Landing Screen -->
      <button onclick="exitToLanding()" title="Keluar / Lock Screen" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition flex items-center gap-1">
        <i class="fa-solid fa-lock"></i> Kunci
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="p-4 max-w-7xl mx-auto">

    <!-- ==================== LANDING / LOCK SCREEN ==================== -->
    <div id="screen-landing" class="min-h-[80vh] flex flex-col items-center justify-center py-10 space-y-8">
      <div class="text-center space-y-3">
        <div class="w-20 h-20 rounded-full bg-brand-500 text-white flex items-center justify-center text-4xl mx-auto shadow-xl ring-4 ring-brand-300 dark:ring-brand-900/50">
          👑
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Raja Rasa COFFEE & RESTO</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Silakan pilih ruangan dan masukkan PIN keamanan untuk masuk</p>
      </div>

      <!-- 3 Room Option Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl px-4">
        
        <!-- Card 1: Kasir -->
        <button type="button" onclick="promptRoomPIN('kasir')" class="bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-700 hover:border-brand-500 dark:hover:border-brand-500 rounded-2xl p-6 text-center cursor-pointer transition shadow-lg hover:shadow-2xl group flex flex-col justify-between w-full focus:outline-none">
          <div>
            <div class="w-16 h-16 rounded-2xl bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 flex items-center justify-center text-2xl mx-auto mb-4 group-hover:scale-110 transition">
              <i class="fa-solid fa-cash-register"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-1">Ruang Kasir</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400">Point of Sale, Transaksi Pelanggan & Cetak Struk</p>
          </div>
          <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700/60 w-full">
            <span class="text-xs font-semibold text-brand-600 dark:text-brand-400 group-hover:underline">Masuk Ruang Kasir &rarr;</span>
          </div>
        </button>

        <!-- Card 2: Manager -->
        <button type="button" onclick="promptRoomPIN('manager')" class="bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-700 hover:border-brand-500 dark:hover:border-brand-500 rounded-2xl p-6 text-center cursor-pointer transition shadow-lg hover:shadow-2xl group flex flex-col justify-between w-full focus:outline-none">
          <div>
            <div class="w-16 h-16 rounded-2xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center text-2xl mx-auto mb-4 group-hover:scale-110 transition">
              <i class="fa-solid fa-chart-line"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-1">Ruang Manager</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400">Laporan Penjualan, Chart Omzet, CRUD Menu & Reset</p>
          </div>
          <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700/60 w-full">
            <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 group-hover:underline">Masuk Ruang Manager &rarr;</span>
          </div>
        </button>

        <!-- Card 3: Kitchen -->
        <button type="button" onclick="promptRoomPIN('kitchen')" class="bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-700 hover:border-brand-500 dark:hover:border-brand-500 rounded-2xl p-6 text-center cursor-pointer transition shadow-lg hover:shadow-2xl group flex flex-col justify-between w-full focus:outline-none">
          <div>
            <div class="w-16 h-16 rounded-2xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-2xl mx-auto mb-4 group-hover:scale-110 transition">
              <i class="fa-solid fa-utensils"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-1">Ruang Kitchen</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400">Kitchen Display System (KDS) & Status Pesanan Real-time</p>
          </div>
          <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700/60 w-full">
            <span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 group-hover:underline">Masuk Ruang Kitchen &rarr;</span>
          </div>
        </button>

      </div>
    </div>


    <!-- ==================== RUANG KASIR ==================== -->
    <div id="workspace-kasir" class="space-y-4 hidden">
      
      <!-- Shift Banner -->
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3.5 rounded-2xl flex flex-wrap items-center justify-between gap-2 shadow-sm">
        <div class="flex items-center space-x-3 text-xs md:text-sm">
          <i class="fa-solid fa-user-circle text-brand-500 text-xl"></i>
          <div>
            <span class="text-gray-500 dark:text-gray-400">Kasir:</span> <strong id="disp-kasir-name" class="text-gray-800 dark:text-white">Kasir Utama</strong> |
            <span class="text-gray-500 dark:text-gray-400">Modal:</span> <strong id="disp-modal-awal" class="text-brand-600 dark:text-brand-400">Rp 100.000</strong> |
            <span class="text-gray-500 dark:text-gray-400">Tgl:</span> <span id="disp-real-date" class="text-gray-700 dark:text-gray-200">--/--/----</span>
